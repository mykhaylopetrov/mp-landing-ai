  </defs>
  <rect width="1200" height="900" fill="url(#b)"/>
  <g opacity=".9">
    <rect x="220" y="480" width="110" height="220" rx="12" fill="#ffffff" opacity=".85"/>
    <rect x="360" y="380" width="110" height="320" rx="12" fill="#ffffff" opacity=".85"/>
    <rect x="500" y="430" width="110" height="270" rx="12" fill="#ffffff" opacity=".85"/>
